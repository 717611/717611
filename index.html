<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Details Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="intro-card" aria-labelledby="form-title">
      <p class="eyebrow">New client intake</p>
      <h1 id="form-title">Tell us about your project</h1>
      <p class="intro-text">
        Share your contact details, project goals, timeline, and budget so we can prepare a helpful follow-up.
      </p>
    </section>

    <form class="client-form" action="#" method="post">
      <fieldset>
        <legend>Contact details</legend>
        <div class="form-grid">
          <label>
            Full name
            <input type="text" name="full-name" autocomplete="name" placeholder="Alex Morgan" required />
          </label>
          <label>
            Company
            <input type="text" name="company" autocomplete="organization" placeholder="Acme Studio" />
          </label>
          <label>
            Email address
            <input type="email" name="email" autocomplete="email" placeholder="alex@example.com" required />
          </label>
          <label>
            Phone number
            <input type="tel" name="phone" autocomplete="tel" placeholder="(555) 123-4567" />
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Project details</legend>
        <div class="form-grid">
          <label>
            Service needed
            <select name="service" required>
              <option value="">Choose a service</option>
              <option>Website design</option>
              <option>Brand identity</option>
              <option>Marketing strategy</option>
              <option>Consulting</option>
              <option>Other</option>
            </select>
          </label>
          <label>
            Desired timeline
            <select name="timeline" required>
              <option value="">Choose a timeline</option>
              <option>ASAP</option>
              <option>Within 1 month</option>
              <option>1-3 months</option>
              <option>3+ months</option>
            </select>
          </label>
          <label>
            Estimated budget
            <select name="budget">
              <option value="">Choose a range</option>
              <option>Under $2,500</option>
              <option>$2,500 - $5,000</option>
              <option>$5,000 - $10,000</option>
              <option>$10,000+</option>
            </select>
          </label>
          <label>
            Preferred contact method
            <select name="contact-method">
              <option>Email</option>
              <option>Phone</option>
              <option>Video call</option>
            </select>
          </label>
        </div>
        <label class="full-width">
          Project summary
          <textarea name="summary" rows="6" placeholder="Tell us about your goals, audience, and anything else we should know." required></textarea>
        </label>
      </fieldset>

      <label class="consent">
        <input type="checkbox" name="consent" required />
        I agree to be contacted about this request.
      </label>

      <button type="submit">Submit client details</button>
    </form>
  </main>
</body>
</html>
